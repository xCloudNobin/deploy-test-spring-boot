spring.application.name=deploy-test-spring-boot

# --- HTTP server ---------------------------------------------------------
server.port=${PORT:8080}
server.address=${BIND_HOST:0.0.0.0}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# --- SQLite persistence ---------------------------------------------------
# Persist outside the ephemeral release directory (mount a volume at DATA_DIR
# or point DB_URL at a durable path for redeploys).
spring.datasource.url=${DB_URL:jdbc:sqlite:${DATA_DIR:data}/taskboard.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# --- JPA --------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Jackson ----------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# --- Actuator health probes -------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,dbProbe
management.endpoint.health.group.liveness.include=livenessState

# --- Logging ----------------------------------------------------------------
logging.level.root=INFO
logging.level.org.hibernate=WARN